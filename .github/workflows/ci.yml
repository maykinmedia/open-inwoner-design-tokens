name: Run CI build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  prettier:
    name: Check frontend code formatting with prettier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Run prettier linter
        run: npm run checkformat

  package-build:
    name: Build NPM package dist
    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://www.npmjs.com/package/@open-inwoner/design-tokens
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Build artifacts
        run: |
          npm ci
          npm run build

      - name: Check for nesting level errors
        run: ./bin/check_token_nesting.py

      - name: Publish package to NPM
        # Only publish when a tag is pushed
        # Tag name must exactly match the version in package.json (no 'v' prefix allowed)
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish
